<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff102b">
  <title>Reset Password — Demo Davpay</title>
  <style>
    :root {
      --red: #ff102b;
      --red-dark: #c51d3b;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --page: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .site-header {
      min-height: 252px;
      padding: 42px 20px 28px;
      color: #fff;
      background: linear-gradient(135deg, #ff293d 0%, #ff001f 100%);
    }
    .brand {
      margin: 0 0 36px;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.5px;
    }
    .search {
      display: flex;
      width: 100%;
      max-width: 900px;
      height: 52px;
      margin: 0 auto 36px;
      overflow: hidden;
      border: 1px solid #e5e5e5;
      border-radius: 9px;
      background: white;
      box-shadow: 0 1px 3px #00000012;
    }
    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 0 15px;
      color: var(--text);
      font: inherit;
      font-size: 17px;
    }
    .search button {
      width: 58px;
      border: 0;
      border-left: 1px solid #eee;
      background: #ffe4e8;
      color: #222;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .header-bottom {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .menu-button {
      width: 54px;
      height: 44px;
      border: 1px solid #ffffff36;
      border-radius: 8px;
      background: #ffffff08;
      color: #fff;
      font-size: 26px;
      line-height: 1;
    }
    .welcome { text-align: center; }
    .welcome p { margin: 0 0 7px; font-size: 16px; }
    .header-links { display: flex; align-items: center; gap: 12px; }
    .header-links a {
      color: #fff;
      text-decoration: none;
      border: 1px solid #ffffffa8;
      border-radius: 7px;
      padding: 9px 18px;
      font-size: 15px;
    }
    main {
      width: min(100% - 40px, 690px);
      margin: 58px auto 72px;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 30px;
      min-height: 460px;
      box-shadow: 0 1px 3px #0000000d;
    }
    h1 {
      margin: 0 0 34px;
      font-size: clamp(23px, 3.5vw, 30px);
      line-height: 1.25;
      font-weight: 600;
    }
    .field { margin-bottom: 18px; }
    input[type="text"] {
      display: block;
      width: 100%;
      height: 54px;
      padding: 12px 15px;
      border: 1px solid #dadce0;
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 17px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      box-shadow: inset 0 1px 2px #00000005;
    }
    input[type="text"]:focus {
      border-color: #d93045;
      box-shadow: 0 0 0 2px #d930451b;
    }
    .submit {
      margin-top: 16px;
      min-height: 54px;
      padding: 0 20px;
      border: 0;
      border-radius: 9px;
      background: var(--red);
      color: white;
      font: inherit;
      font-size: 17px;
      cursor: pointer;
    }
    .submit:hover { background: #e90020; }
    .demo-note {
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .status {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fce8e6;
      color: #a50e0e;
      font-size: 14px;
      line-height: 1.45;
    }
    .success-screen {
      display: none;
      min-height: 330px;
      padding: 26px 10px;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .success-icon {
      width: 150px;
      height: 150px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: #00cf50;
      display: grid;
      place-items: center;
      box-shadow: 0 5px 22px #00cf5040;
    }
    .success-icon svg {
      width: 76px;
      height: 76px;
      display: block;
    }
    .success-screen h2 {
      margin: 0;
      color: #202124;
      font-size: clamp(22px, 4vw, 28px);
      line-height: 1.35;
      font-weight: 600;
    }
    .success-screen p {
      margin: 10px 0 0;
      color: #5f6368;
      font-size: 15px;
      line-height: 1.5;
    }
    footer {
      border-top: 1px solid #e6e6e6;
      padding: 28px 20px 36px;
    }
    .footer-inner { max-width: 900px; margin: 0 auto; }
    footer h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
    .footer-links {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid #c96a7a;
      border-radius: 8px;
      overflow: hidden;
    }
    .footer-links a {
      min-height: 56px;
      padding: 12px 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #b32645;
      text-decoration: none;
      font-size: 15px;
      line-height: 1.4;
      border-right: 1px solid #c96a7a;
    }
    .footer-links a:last-child { border-right: 0; }
    @media (min-width: 700px) {
      .site-header { padding-left: 32px; padding-right: 32px; }
      .brand { font-size: 34px; }
      .panel { padding: 38px; }
    }
    @media (max-width: 420px) {
      .site-header { padding: 32px 14px 24px; min-height: 0; }
      .brand { margin-bottom: 28px; font-size: 28px; }
      .search { margin-bottom: 27px; height: 48px; }
      .search input { font-size: 15px; }
      .header-bottom { gap: 10px; }
      .menu-button { width: 45px; height: 40px; }
      .welcome p { font-size: 14px; }
      .header-links { gap: 7px; }
      .header-links a { padding: 8px 12px; font-size: 14px; }
      main { width: calc(100% - 28px); margin: 38px auto 52px; }
      .panel { padding: 24px 18px; min-height: 0; }
      h1 { margin-bottom: 28px; }
      label { font-size: 16px; }
      input[type="text"] { height: 54px; font-size: 16px; }
      .submit { min-height: 50px; font-size: 16px; }
      footer { padding: 24px 14px 30px; }
      .footer-links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .footer-links a { border-bottom: 1px solid #c96a7a; }
      .footer-links a:nth-child(2) { border-right: 0; }
      .footer-links a:nth-child(n+3) { border-bottom: 0; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <p class="brand">Davpay</p>

    <form class="search" id="searchForm" role="search">
      <input type="search" placeholder="Cari produk disini" aria-label="Cari produk">
      <button type="submit" aria-label="Cari">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.7" stroke="currentColor" stroke-width="2.4"/>
          <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <div class="header-bottom">
      <button class="menu-button" type="button" aria-label="Menu" title="Menu">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="welcome">
        <p>Selamat Datang!</p>
        <nav class="header-links" aria-label="Navigasi akun">
          <a href="#login">Login</a>
          <span aria-hidden="true">|</span>
          <a href="#daftar">Daftar</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Masukan Nama lengkap</h1>
      <form id="resetForm">
        <div class="field">
          <input id="firstName" name="firstName" type="text"
                 placeholder="Masukkan nama depan" aria-label="Nama Depan"
                 autocomplete="given-name" required>
        </div>
        <div class="field">
          <input id="lastName" name="lastName" type="text"
                 placeholder="Masukkan nama belakang" aria-label="Nama Belakang"
                 autocomplete="family-name" required>
        </div>
        <button class="submit" type="submit">Konfirmasi</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>

      <div class="success-screen" id="successScreen" role="status" aria-live="polite">
        <div class="success-icon" aria-hidden="true">
          <svg viewBox="0 0 80 80" fill="none">
            <path d="M16 41 L31 56 L64 23" stroke="#ffffff" stroke-width="8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2>Berhasil Terkonfirmasi</h2>
        <p>Formulir Anda telah dikonfirmasi.</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <h2>About</h2>
      <nav class="footer-links" aria-label="Tautan informasi">
        <a href="#privacy">Privacy Policy</a>
        <a href="#terms">Kebijakan Layanan</a>
        <a href="#information">Informasi</a>
        <a href="#contact">Kontak</a>
      </nav>
    </div>
  </footer>

  <script>
    // Demo lokal saja: tidak ada permintaan jaringan dan tidak ada penyimpanan password.
    document.getElementById('searchForm').addEventListener('submit', function (event) {
      event.preventDefault();
    });

    document.getElementById('resetForm').addEventListener('submit', function (event) {
      event.preventDefault();
      // Alur demo lokal: hanya menampilkan keadaan sukses, tanpa mengirim/menyimpan data.
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('pageTitle').style.display = 'none';
      document.getElementById('successScreen').style.display = 'flex';
    });
  </script>
</body>
</html>
